<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>PaperLens 分頁</title>
<style>
  :root { color-scheme: light dark; --bg: #e6e8ef; --tab: #d5d8e2; --cur: #f7f8fb; --fg: #1b1d23; --muted: #5b6272; --accent: #4f46e5; --line: #c5c9d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161b; --tab: #1d2027; --cur: #2a2e38; --fg: #e8eaf0; --muted: #9aa2b1; --line: #343946; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 12.5px/1 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; user-select: none; }
  #bar { display: flex; align-items: flex-end; height: 100%; padding: 6px 8px 0; gap: 2px; border-bottom: 1px solid var(--line); }
  #tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; flex: 0 1 auto; height: 100%; }
  .tab { position: relative; display: flex; align-items: center; gap: 6px; height: 100%; min-width: 46px; width: 210px; flex: 0 1 210px;
    padding: 0 6px 0 10px; border-radius: 9px 9px 0 0; background: var(--tab); color: var(--muted); cursor: default; overflow: hidden; }
  .tab:hover { background: color-mix(in srgb, var(--tab) 60%, var(--cur)); color: var(--fg); }
  .tab.cur { background: var(--cur); color: var(--fg); box-shadow: inset 0 2px 0 var(--accent); }
  .tab.drop::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: var(--accent); }
  .ico { flex: none; font-size: 12px; opacity: .8; }
  .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }
  .x { flex: none; width: 18px; height: 18px; border: 0; border-radius: 50%; background: transparent; color: inherit;
    font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; opacity: .65; }
  .x:hover { background: rgba(127, 127, 127, .35); opacity: 1; }
  .tab:not(.cur):not(:hover) .x { visibility: hidden; }
  #new { flex: none; width: 28px; height: 26px; margin: 0 0 4px 4px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab); color: var(--fg); }
  #rest { flex: 1; height: 100%; min-width: 20px; }
  body.dragfile #bar { outline: 2px dashed var(--accent); outline-offset: -3px; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <button id="new" title="新分頁（Ctrl+N）">＋</button>
  <div id="rest" title="按兩下開新分頁；也可以把 PDF 拖到這裡"></div>
</div>
<script src="tabs.js"></script>
</body>
</html>
